# Builds the site and publishes it to https://patternsstudio.co on every push to main (launched 2026-11-19).
# The custom domain is set in this repo's Settings → Pages (it moved here from nimkarkedar/patternsstudio.co).
# For a noindexed preview build instead: SITE_URL=https://nimkarkedar.github.io, BASE_PATH=/patternsstudio-v2, PREVIEW='true'.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://patternsstudio.co
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
